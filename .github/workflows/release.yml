name: Release Module

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get Version
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV

      - name: Substitute variables in module.json
        uses: microsoft/variable-substitution@v1
        with:
          files: 'module.json'
        env:
          version: ${{ env.VERSION }}
          download: https://github.com/${{ github.repository }}/releases/download/${{ env.VERSION }}/module.zip

      - name: Zip files
        run: |
          zip -r module.zip module.json scripts styles templates lang "Скрин"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            module.json
            module.zip
          name: Release ${{ env.VERSION }}
          generate_release_notes: true

      - name: Publish to Foundry VTT Website
        run: |
          curl -X POST "https://api.foundryvtt.com/_api/packages/release_version/" \
          -H "Content-Type: application/json" \
          -H "Authorization: ${{ secrets.FOUNDRY_RELEASE_TOKEN }}" \
          -d '{
            "id": "ClueBook",
            "release": {
              "version": "'"${{ env.VERSION }}"'",
              "manifest": "https://github.com/${{ github.repository }}/releases/latest/download/module.json",
              "notes": "https://github.com/${{ github.repository }}/releases/tag/${{ env.VERSION }}",
              "compatibility": {
                "minimum": "12",
                "verified": "14"
              }
            }
          }'
